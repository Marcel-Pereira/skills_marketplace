{% extends "base.html" %} {% block title %}Sign up | Skills Marketplace{%
endblock %} {% block content %}
<main class="main">
    <section class="auth-card">
        <h1>Create an account</h1>
        <form method="post">
            <label for="email">Email <span class="required">*</span></label>
            <input
                id="email"
                name="email"
                type="email"
                value="{{ request.form.get('email', '') }}"
                autocomplete="email"
                maxlength="255"
                required
            />

            <label for="username">Username <span class="required">*</span></label>
            <input
                id="username"
                name="username"
                type="text"
                value="{{ request.form.get('username', '') }}"
                autocomplete="username"
                maxlength="50"
                required
            />

            <label for="password">Password <span class="required">*</span></label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                required
            />

            <label for="bio">Bio <span>(optional)</span></label>
            <textarea id="bio" name="bio" rows="4">
                {{ request.form.get('bio', '') }}
            </textarea>

            <label for="country_code"
                >Country code <span>(optional)</span></label
            >
            <input
                id="country_code"
                name="country_code"
                type="text"
                value="{{ request.form.get('country_code', '') }}"
                maxlength="2"
                placeholder="AR"
            />

            <label for="timezone">Timezone <span>(optional)</span></label>
            <input
                id="timezone"
                name="timezone"
                type="text"
                value="{{ request.form.get('timezone', '') }}"
                maxlength="50"
                placeholder="America/Argentina/Buenos_Aires"
            />

            <button type="submit">Sign up</button>
        </form>
        <p>
            Already have an account?
            <a href="{{ url_for('main.login') }}">Log in</a>.
        </p>
    </section>
</main>
{% endblock %}
