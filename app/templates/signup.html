{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
  <div class="box">
    <h1>Sign up</h1>
    <p class="muted">Create an account to get started</p>
    <form method="post" class="stack">
      <label>Email
        <input id="email" name="email" type="email" value="{{ request.form.get('email', '') }}"
               autocomplete="email" maxlength="255" required>
      </label>
      <label>Username
        <input id="username" name="username" type="text" value="{{ request.form.get('username', '') }}"
               autocomplete="username" maxlength="50" required>
      </label>
      <label>Password
        <input id="password" name="password" type="password" autocomplete="new-password" required>
      </label>
      <label>Bio (optional)
        <textarea id="bio" name="bio" rows="4">{{ request.form.get('bio', '') }}</textarea>
      </label>
      <label>Country code (optional)
        <input id="country_code" name="country_code" type="text" value="{{ request.form.get('country_code', '') }}"
               maxlength="2" placeholder="AR">
      </label>
      <label>Timezone (optional)
        <input id="timezone" name="timezone" type="text" value="{{ request.form.get('timezone', '') }}"
               maxlength="50" placeholder="America/Argentina/Buenos_Aires">
      </label>
      <button type="submit">Create account</button>
    </form>
  </div>
  <p class="below-box">Already have an account? <a href="{{ url_for('main.login') }}">Sign in</a></p>
{% endblock %}
