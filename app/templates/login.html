{% extends "base.html" %} {% block title %}Log in | Skills Marketplace{%
endblock %} {% block content %}
<main class="main">
    <section class="auth-card">
        <h1>Log in</h1>
        <form method="post">
            <label for="email">Email <span class="required">*</span></label>
            <input
                id="email"
                name="email"
                type="email"
                value="{{ request.form.get('email', '') }}"
                autocomplete="email"
                maxlength="255"
                required
                autofocus
            />

            <label for="password"
                >Password <span class="required">*</span></label
            >
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            />

            <button type="submit">Log in</button>
        </form>
        <p>
            Need an account? <a href="{{ url_for('main.signup') }}">Sign up</a>.
        </p>
    </section>
</main>
{% endblock %}
