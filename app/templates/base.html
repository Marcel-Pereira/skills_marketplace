<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Skills Marketplace{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a class="brand" href="{{ url_for('main.index') }}">Skills Marketplace</a>
    <div class="nav-links">
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('main.logged_in') }}">Account</a>
        <form action="{{ url_for('main.logout') }}" method="post">
          <button class="link-button" type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('main.login') }}">Log in</a>
        <a href="{{ url_for('main.signup') }}">Sign up</a>
      {% endif %}
    </div>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
