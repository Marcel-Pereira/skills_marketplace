{% extends "base.html" %}
{% from "_macros.html" import chip_picker %}
{% block title %}Get started{% endblock %}
{% block content %}
  <p class="muted">Step {{ step }} of 2</p>
  <h1>{{ question }}</h1>

  <form method="post">
    <p class="muted">Pick as many as you like.</p>
    {{ chip_picker(field, categories) }}
    <button>Continue</button>
  </form>

{% endblock %}
